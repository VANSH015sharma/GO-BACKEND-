version: '3.9'
services:
  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me}
      DATABASE_URL: file:./prisma/dev.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-v1}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-4000}
